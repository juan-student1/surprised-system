# CENTINELA · Integración continua
# Corre en cada push y PR: lint de Python (ruff), tests (pytest), lint de scripts (shellcheck),
# secretos en el historial (gitleaks) y vulnerabilidades/configuración (trivy fs).
# Las acciones van fijadas por SHA y las herramientas se descargan con versión fija y checksum verificado:
# el repo es público y un tag movido en una acción de terceros no debe poder ejecutar código aquí.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "0.76.1"

jobs:
  python:
    name: ruff + pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"          # la misma del Dockerfile de Cloud Run
          cache: pip
          cache-dependency-path: |
            servidor/app/requirements.txt
            requirements-dev.txt
      - name: Dependencias
        run: pip install -r servidor/app/requirements.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: pytest
        run: pytest

  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck (viene instalado en ubuntu-24.04)
        run: |
          shellcheck --version
          git ls-files '*.sh' | xargs shellcheck -S warning

  seguridad:
    name: gitleaks + trivy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0                  # gitleaks revisa TODO el historial
      - name: Instalar gitleaks y trivy (versión fija + checksum)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C bin gitleaks
          base=https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION
          curl -fsSLO "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gitleaks (historial completo)
        run: gitleaks git . --redact --no-banner --exit-code 1
      - name: trivy fs (dependencias, secretos y configuración)
        run: |
          trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --skip-dirs gateway/node_modules .
